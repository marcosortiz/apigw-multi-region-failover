[pytest]
# Pytest configuration for Lambda function testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    
# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require Docker/SAM CLI)
    slow: Tests that take longer to run

# Coverage options (when using --cov)
[coverage:run]
source = src
omit = 
    */tests/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
